<style>
/* Layout: fluxograma curricular — períodos em colunas, como a grade impressa dos PPCs; faixa superior com abas por curso. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18222f; --muted:#5b6878; --line:#c9d1da; --line-soft:#dde3ea;
  --core:#0f6e74; --core-bg:#d7eeee; --core-ink:#084c50;
  --ext:#8a5a00; --ext-bg:#fbecc8;
  --opt-bg:#f3f5f8;
  --hl:#c2410c; --hl-soft:#fde3d4;
  --warn:#b45309; --warn-bg:#fdecd3;
  --edge:#7f8da0;
  --ok:#22743a; --bad:#b42318;
  --c0:#2f5fae; --c1:#a1402a; --c2:#6a4aa5; --c3:#2b7a3d; --c4:#9a6a12;
  --f-display:"IBM Plex Sans", system-ui, sans-serif;
  --f-card:"IBM Plex Sans Condensed","Arial Narrow", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
:root{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);font-size:14px;line-height:1.45}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;max-width:1600px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:end;justify-content:space-between}
h1{font-size:1.6rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:70ch}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 14px}
nav.tabs a{font:500 .85rem var(--f-display);text-decoration:none;color:var(--ink);padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);display:inline-flex;gap:7px;align-items:center}
nav.tabs a .dot{width:9px;height:9px;border-radius:50%;background:var(--cc,var(--muted))}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav.tabs a:focus-visible,.card:focus-visible,.chip:focus-visible,button:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted);margin-bottom:12px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:22px;height:12px;border-radius:3px;border:1px solid var(--line);display:inline-block}
.sw.core{background:var(--core-bg);border-color:var(--core)}
.sw.ext{background:var(--ext-bg);border-color:var(--ext)}
.sw.opt{background:var(--opt-bg);border-style:dashed}
.sw.edge{height:0;border:0;border-top:2px solid var(--edge);border-radius:0}
.sw.hl{height:0;border:0;border-top:2px solid var(--hl);border-radius:0}
.meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.82rem;color:var(--muted);margin-bottom:10px}
.meta b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.toolbar input[type=search]{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-width:0;width:240px;max-width:100%}
.toolbar label{font-size:.82rem;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
button{font:inherit;font-size:.82rem;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}

/* Fluxograma */
.scroller{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.flow{position:relative;display:grid;grid-template-columns:repeat(10,152px);gap:0 26px;padding:12px 16px 18px;width:max-content}
.flow svg.edges{position:absolute;inset:0;pointer-events:none;overflow:visible}
.col{display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.colhead{font:600 .78rem var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:2px}
.colhead small{font:500 .74rem var(--f-mono);letter-spacing:0;text-transform:none}
.card{font-family:var(--f-card);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:6px 8px 5px;cursor:pointer;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:3px;transition:opacity .15s,border-color .15s,box-shadow .15s;min-height:54px}
.card .nm{font-size:.86rem;line-height:1.2;font-weight:500}
.card .ft{display:flex;justify-content:space-between;gap:6px;font:400 .7rem var(--f-mono);color:var(--muted)}
.card.core{background:var(--core-bg);border-color:var(--core)}
.card.core .ft .tag{color:var(--core-ink);font-weight:500}
.card.ext{background:var(--ext-bg);border-color:var(--ext)}
.card.opt{background:var(--opt-bg);border-style:dashed}
.flow.focus .card{opacity:.28}
.flow.focus .card.on{opacity:1}
.card.sel{box-shadow:0 0 0 2px var(--hl);border-color:var(--hl)}
.card.anc{box-shadow:0 0 0 2px var(--c0)}
.card.desc{box-shadow:0 0 0 2px var(--hl);}
.card.match{outline:2px dashed var(--hl);outline-offset:1px}
path.e{fill:none;stroke:var(--edge);stroke-width:1.3;opacity:.9;marker-end:url(#ah)}
.ah{fill:var(--edge)} .ahu{fill:var(--c0)} .ahd{fill:var(--hl)}
.flow.focus path.e{opacity:.08}
.flow.focus path.e.on{opacity:1;stroke-width:2}
.flow.focus path.e.on.up{stroke:var(--c0);marker-end:url(#ahu)}
.flow.focus path.e.on.down{stroke:var(--hl);marker-end:url(#ahd)}
.flow.noedges path.e:not(.on){display:none}

.detail{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:8px 28px}
.detail.empty{display:block;color:var(--muted)}
.detail h2{font-size:1.1rem;margin:0 0 2px;grid-column:1/-1;text-wrap:balance}
.detail .eyebrow{grid-column:1/-1;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.detail dl{margin:0;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 12px;font-size:.86rem;align-content:start}
.detail dt{color:var(--muted)}
.detail dd{margin:0;min-width:0}
.detail ul{margin:0;padding-left:18px}
.pill{display:inline-block;font-size:.74rem;padding:1px 8px;border-radius:999px;background:var(--core-bg);color:var(--core-ink);border:1px solid var(--core)}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.chb{font-family:var(--f-mono);font-size:.78rem;font-variant-numeric:tabular-nums}
.linkish{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px;cursor:pointer;background:none;border:0;padding:0;font:inherit}

/* Visão global */
.gscroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.global{border-collapse:collapse;width:100%;min-width:980px}
table.global th,table.global td{border-bottom:1px solid var(--line-soft);vertical-align:top;padding:8px}
table.global thead th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:.85rem;border-bottom:2px solid var(--ink);z-index:2}
table.global thead th a{color:inherit;text-decoration:none;display:inline-flex;gap:7px;align-items:center}
table.global thead th .dot{width:10px;height:10px;border-radius:50%;background:var(--cc)}
table.global thead th small{display:block;font:400 .72rem var(--f-mono);color:var(--muted);margin-top:2px}
table.global tbody th{font:600 .8rem var(--f-display);color:var(--muted);text-align:left;white-space:nowrap;width:64px}
table.global tbody th small{display:block;font:400 .7rem var(--f-mono)}
.cell{display:flex;flex-wrap:wrap;gap:4px}
.cellch{font:400 .7rem var(--f-mono);color:var(--muted);margin-top:5px}
.chip{font:500 .76rem/1.2 var(--f-card);padding:3px 7px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:left}
.chip.core{background:var(--core-bg);border-color:var(--core);color:var(--core-ink)}
.chip.ext{background:var(--ext-bg);border-color:var(--ext)}
.chip.opt{background:var(--opt-bg);border-style:dashed;color:var(--muted)}
.gwrap.focus .chip{opacity:.3}
.gwrap.focus .chip.on{opacity:1;box-shadow:0 0 0 2px var(--hl)}
.ghint{font-size:.82rem;color:var(--muted);margin:0 0 10px;min-height:1.3em}

/* Núcleo comum */
table.nb{border-collapse:collapse;width:100%;min-width:820px;font-size:.85rem}
table.nb th,table.nb td{padding:7px 9px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}
table.nb thead th{border-bottom:2px solid var(--ink);font-size:.8rem}
table.nb td.c{font-variant-numeric:tabular-nums;white-space:nowrap}
table.nb td.c .n{display:block;font:400 .72rem var(--f-card);color:var(--muted);white-space:normal;max-width:150px}
table.nb td.dif{background:var(--warn-bg)}
table.nb td.dif b{color:var(--warn)}
table.nb td.none{color:var(--muted)}
.nbn{font:600 .8rem var(--f-mono);text-align:center}
section.obs{margin-top:22px}
section.obs h2,section.nbh h2{font-size:1.05rem;margin:0 0 8px}
section.obs ul{margin:0;padding-left:18px;max-width:95ch;display:grid;gap:6px}
.ppcswitch{display:inline-flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--surface);flex:none}
.ppcswitch button{border:0;border-radius:0;padding:8px 16px;font:700 .86rem var(--f-display);letter-spacing:.06em;background:transparent;color:var(--ink);text-align:center}
.ppcswitch button+button{border-left:2px solid var(--ink)}
.ppcswitch button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ppcswitch button small{display:block;font:400 .68rem var(--f-mono);letter-spacing:0;opacity:.8}
.st{font:500 .72rem var(--f-card)}
.st.ok{color:var(--ok)} .st.cond{color:var(--warn)} .st.opt{color:var(--muted)} .st.bad{color:var(--bad)}
.card .ft .st{font-size:.68rem;text-align:right}
.card .ft{align-items:baseline}
.card .chT{font:600 1.05rem var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.card .chT small{font-size:.68rem;font-weight:400;color:var(--muted)}
.card .chm{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;border-top:1px dashed var(--line);padding-top:3px;font:400 .66rem var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.card .chm span{display:flex;flex-direction:column;line-height:1.15}
.card .chm i{font:normal 500 .56rem var(--f-card);color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.card .chm .z{color:var(--muted);opacity:.55}
table.eq{border-collapse:collapse;width:100%;min-width:1050px;font-size:.84rem}
table.eq th,table.eq td{padding:7px 9px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}
table.eq thead th{font-size:.78rem;border-bottom:1px solid var(--line);background:var(--surface)}
table.eq thead tr:last-child th{border-bottom:2px solid var(--ink)}
table.eq th.grp{text-transform:uppercase;letter-spacing:.06em;font-size:.72rem;color:var(--muted);border-bottom:1px solid var(--line)}
table.eq td.chb{white-space:nowrap;font-variant-numeric:tabular-nums}
table.eq .mut{color:var(--muted)}
table.eq .nowrap{white-space:nowrap}
table.eq tr.sep td{background:var(--bg);font-weight:600;font-size:.8rem;color:var(--ink);padding-top:14px}
table.nbq{border-collapse:collapse;width:100%;min-width:1240px;font-size:.82rem}
table.nbq th,table.nbq td{padding:6px 8px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}
table.nbq thead th{font-size:.78rem;border-bottom:2px solid var(--ink);background:var(--surface);white-space:nowrap}
table.nbq tbody.g{border-top:2px solid var(--line)}
table.nbq td.ref{font-weight:600;min-width:150px}
table.nbq td.ref small{display:block;font:400 .7rem var(--f-card);color:var(--muted);margin-top:2px}
table.nbq td.cur{white-space:nowrap}
table.nbq td.cur .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cc);margin-right:5px}
table.nbq td.num{white-space:nowrap;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:.78rem}
table.nbq td.dif{background:var(--warn-bg)}
table.nbq td.obsc{min-width:280px;max-width:420px;background:var(--bg)}
table.nbq td.obsc ul{margin:0;padding-left:16px}
table.nbq td.obsc li{margin:0 0 4px}
table.nbq td.obsc .okk{color:var(--ok)}
table.nbq .eqi{margin:0 0 4px;min-width:250px}
table.nbq .nbtip{white-space:nowrap}
table.nbq .eqi small{display:block;color:var(--muted)}
table.nbq .mut{color:var(--muted)}
.nbtip{font-size:.72rem;color:var(--muted);margin-left:4px}
.tagq{display:inline-block;white-space:nowrap;font:500 .74rem var(--f-card);padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.tagq.ok{color:var(--ok)} .tagq.cond{color:var(--warn)} .tagq.opt{color:var(--muted)} .tagq.bad{color:var(--bad)} .tagq.new{color:var(--c0)}
.eqh h2{font-size:1.05rem;margin:0 0 6px}
.eqbar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;align-items:center}
.eqbar button{display:inline-flex;gap:6px;align-items:center;border-radius:999px}
.eqbar button .dot{width:9px;height:9px;border-radius:50%;background:var(--cc)}
.eqbar button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.eqbar button b{font-variant-numeric:tabular-nums;font-weight:600}
.eqbar input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:220px;max-width:100%}
section.gsearch{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
.gsl{font:600 .82rem var(--f-display)}
#gq{font:inherit;font-size:.95rem;padding:9px 12px;border:1.5px solid var(--ink);border-radius:6px;background:var(--surface);color:var(--ink);width:100%;max-width:520px}
#gres .ghint{margin:2px 0 6px}
table.gres{border-collapse:collapse;width:100%;min-width:860px;font-size:.84rem}
table.gres th,table.gres td{padding:6px 8px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}
table.gres thead th{border-bottom:2px solid var(--ink);font-size:.8rem;white-space:nowrap}
table.gres thead th .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--cc);margin-right:6px}
table.gres td .none{color:var(--muted)}
.occ{display:flex;align-items:center;gap:6px;margin:0 0 3px;padding:2px 7px 2px 2px;font:400 .78rem var(--f-mono);font-variant-numeric:tabular-nums;border-radius:4px;white-space:nowrap}
.occ .ppc{font:600 .66rem var(--f-card);text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:3px}
.occ.atual .ppc{background:var(--opt-bg);color:var(--ink);border:1px solid var(--line)}
.occ.novo .ppc{background:var(--ink);color:var(--bg)}
.chip.hit{outline:2px solid var(--hl);outline-offset:1px}
.pps{display:inline-flex;flex-wrap:nowrap;gap:3px}
.ppt{font:600 .66rem var(--f-mono);letter-spacing:.02em;padding:1px 5px;border-radius:3px;color:var(--cc);border:1px solid var(--cc);background:var(--surface)}
footer{margin-top:28px;font-size:.78rem;color:var(--muted);max-width:90ch}
@media (max-width:720px){.ppcswitch{order:-1}.detail{grid-template-columns:minmax(0,1fr)}h1{font-size:1.3rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

 Transporte", 4, 60], ["Introdução aos Fenômenos de Transporte", 8, 60], ["Introdução aos Fenômenos de Transporte", 7, 60], null, ["Introdução à Fenômenos de Transportes", 6, 60]]}, {"ref": "Física 3", "n": 2, "c": [null, null, null, ["Física 3", 4, 60], ["Física 3", 4, 60]]}, {"ref": "Estática", "n": 2, "c": [["Estática", 3, 60], null, null, ["Estática", 3, 60], null]}, {"ref": "Introdução à Mecânica dos Sólidos", "n": 2, "c": [null, ["Introdução a Mecânica dos Sólidos", 7, 60], ["Introdução à Mecânica dos Sólidos", 6, 60], null, null]}, {"ref": "Ciência dos Materiais", "n": 2, "c": [null, null, null, ["Ciência dos Materiais", 4, 60], ["Ciência dos Materiais 1", 3, 60]]}], "obs": [{"curso": "Eng. Materiais", "onde": "Equivalências", "txt": "O quadro de equivalências cita \"Introdução à Mecânica dos Sólidos\" (equivalente a Resistência dos Materiais), \"Física Experimental 2\" e \"Física 4 (optativa)\", que não aparecem no Quadro 7 da estrutura curricular. Os nomes do quadro de equivalências (Química Geral 1/2/3) também diferem da matriz (Química 1A/2A/3)."}, {"curso": "Eng. Mecânica", "onde": "Equivalências", "txt": "O quadro cita componentes do perfil novo que não estão na matriz 2027 com o mesmo nome: \"Ensaios Mecânicos\" (associado aqui a Ensaio dos Materiais), \"Máquinas Térmicas 2\" e \"Física 4\". Também indica Geometria Analítica e Cálculo Vetorial com 30h e Linguagem de Programação com 60h, diferente da matriz (60h e 45h)."}, {"curso": "Eng. Civil", "onde": "Equivalências", "txt": "Versão final do PPC (01/10/26). Quadro 6 (vale nos dois sentidos) e Quadro 7 (só do perfil ativo para o novo, vários com estudo complementar de 15h ou 30h). Divergências entre os quadros e as ementas: Desenho Técnico, Química Geral, Probabilidade e Estatística e Estruturas Metálicas têm \"Equivalência: não tem\" na ementa, mas constam do Quadro 7; a ementa de Estática cita Mecânica Geral 1 com código UAC00179 (no quadro, UAC00035); a de Mecânica dos Solos 2A cita Mecânica dos Solos 1 e 2. O quadro usa \"Gerenciamento de Projetos e Obras A\" (30h). Sem equivalência: Desenho Técnico para Engenharia Civil, Física Experimental 1 e ACEs; do perfil ativo, Química 2A (que antes entrava na junção de Química Geral) e Física Geral 3 ficam sem correspondente."}, {"curso": "Eng. Mecânica", "onde": "7º período", "txt": "O subtotal do PPC indica 420 h (315 h teóricas), mas as disciplinas listadas somam 360 h. O resumo do PPC prevê Optativas 1 a 4, e a matriz só traz as Optativas #2, #3 e #4. Provavelmente a Optativa #1 (60 h) foi omitida do 7º período. Ela não foi incluída aqui para não alterar a proposta; com ela, o curso fecha 3.600 h."}, {"curso": "Eng. Materiais", "onde": "7º e 9º períodos", "txt": "\"Economia circular e Reciclagem dos Materiais\" aparece no 7º e no 9º período do Quadro 7. Na representação gráfica do perfil, ela aparece só no 7º."}, {"curso": "Eng. Materiais", "onde": "8º e 9º períodos", "txt": "\"Optativa 4\" aparece no 8º e no 9º período. Na representação gráfica, o 8º período tem a Optativa 3."}, {"curso": "Eng. Materiais", "onde": "Quadro 7 × perfil gráfico", "txt": "Há nomes diferentes entre o Quadro 7 e o perfil gráfico (ex.: Química 1A/2A × Química Geral 1/2/3; o perfil gráfico do 5º período inclui \"Introdução à mecânica dos sólidos\", que não está no Quadro 7). Esta planilha segue o Quadro 7 (estrutura curricular)."}, {"curso": "Eng. Materiais", "onde": "Pré-requisitos", "txt": "Pré-requisitos citam nomes que não existem na matriz (ex.: \"Química Geral 1\" para Química 3, \"Química 2\" para Lab. de Química, \"Cálculo Diferencial e Integral 3\" para Cálculo 4). Mantidos como no PPC."}, {"curso": "Eng. Civil", "onde": "Pré-requisitos", "txt": "Pré-requisitos citam \"Fenômenos de Transporte\", \"Geologia de Engenharia\" e \"Higiene e Segurança no Trabalho\", enquanto a matriz usa \"Introdução aos Fenômenos de Transporte\", \"Geologia para Engenharia\" e \"Higiene e Segurança do Trabalho\". Mantidos como no PPC."}, {"curso": "Eng. Elétrica", "onde": "Pré-requisitos", "txt": "\"Introdução a Mecânica dos Sólidos\" tem como pré-requisito \"Física Geral 1\" (na matriz a disciplina se chama Física 1). ACE-1 não aparece com esse nome: a extensão do 1º período é \"Introdução a Engenharia Elétrica\" (60 h extensionistas)."}, {"curso": "Núcleo básico", "onde": "Geometria Analítica", "txt": "Civil, Elétrica, Eletrônica e Mecânica oferecem \"Geometria Analítica e Cálculo Vetorial\" com 60 h; Materiais, \"Geometria Analítica\" com 60 h. Todas no 1º período."}, {"curso": "Núcleo básico", "onde": "Álgebra Linear", "txt": "Todos os cursos: 30 h, no 2º período."}, {"curso": "Núcleo básico", "onde": "Desenho Técnico e Química Geral", "txt": "Civil, Elétrica, Eletrônica e Mecânica: 30 h teóricas + 30 h práticas. Materiais: 60 h teóricas. A CH total é igual (60 h), mas a divisão teoria/prática difere."}, {"curso": "Núcleo básico", "onde": "Programação", "txt": "Civil oferece no 1º período (Linguagem de Programação, 45 h); os demais no 2º. Elétrica/Eletrônica: Programação em C (45 h); Mecânica e Materiais: Linguagem de Programação (45 h), com divisões teoria/prática diferentes."}, {"curso": "Núcleo básico", "onde": "Cálculo Numérico", "txt": "Civil e Materiais: 60 h teóricas. Elétrica, Eletrônica e Mecânica: 45 h teóricas + 15 h práticas. Materiais oferece no 4º período; os demais no 3º."}]}</script>

<script>
(function(){
const NOVO=JSON.parse(document.getElementById('data').textContent);
const ATUAL=JSON.parse(document.getElementById('atual').textContent);
const EQ=JSON.parse(document.getElementById('eqdata').textContent);
const NBEQ=JSON.parse(document.getElementById('nbeq').textContent);
let mode='novo';
try{const m=localStorage.getItem('ppc-mode');if(m==='atual'||m==='novo')mode=m}catch(e){}
const DS=()=>mode==='novo'?NOVO:ATUAL;
const SLUG=['civil','eletrica','eletronica','mecanica','materiais'];
const SHORT=['Civil','Elétrica','Eletrônica','Mecânica','Materiais'];
const view=document.getElementById('view');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kind=it=>{const n=it.nome.toLowerCase();
  if(it.nbc) return 'core';
  if(/^ace|atividade curricular de extens/.test(n)) return 'ext';
  if(/^optativa/.test(n)) return 'opt';
  return '';};
const sum=a=>a.reduce((x,y)=>x+(y||0),0);
const SIT={'Aproveitada no PPC novo':['ok','aproveitada'],'Aproveitada com condição':['cond','com condição'],'Vira optativa no PPC novo':['opt','vira optativa'],'Provável omissão no quadro':['cond','omissão?'],'Sem equivalência no quadro':['bad','sem equivalência']};
const sit=it=>SIT[it.sit]||['opt',it.sit||''];
const SUB={novo:'Disciplinas por período dos cinco PPCs novos (implantação em 2027.1), com o núcleo básico comum e os pré-requisitos. Os períodos, nomes, cargas horárias e pré-requisitos estão exatamente como em cada PPC.',
  atual:'Disciplinas obrigatórias por período das matrizes ativas no SIGAA, com os pré-requisitos dos PPCs vigentes, as disciplinas compartilhadas entre os cursos (mesmo código) e o destino de cada uma na transição para o PPC novo.'};

// alternância PPC
const bA=document.getElementById('bAtual'),bN=document.getElementById('bNovo');
function setMode(m){mode=m;try{localStorage.setItem('ppc-mode',m)}catch(e){}
  bA.setAttribute('aria-pressed',m==='atual');bN.setAttribute('aria-pressed',m==='novo');
  document.getElementById('sub').textContent=SUB[m];
  document.body.dataset.mode=m;footer();route();}
bA.onclick=()=>setMode('atual');bN.onclick=()=>setMode('novo');

// abas
const tabs=[['global','Visão global',null],...SLUG.map((s,i)=>[s,'Eng. '+SHORT[i],i]),['nucleo','Núcleo comum',null],['equivalencias','Equivalências',null]];
document.getElementById('tabs').innerHTML=tabs.map(([h,l,i])=>`<a href="#${h}" data-h="${h}"${i!=null?` style="--cc:var(--c${i})"`:''}>${i!=null?'<span class="dot"></span>':''}${l}</a>`).join('');
function footer(){
  const D=DS();
  document.getElementById('foot').innerHTML=mode==='novo'
   ?'Fonte: planilha Matrizes_por_periodo_nucleo_basico_comum.xlsx, transcrita de: '+D.courses.map(c=>`${esc(c.nome)}: ${esc(c.fonte)}`).join(' · ')+'. As setas ligam cada disciplina aos pré-requisitos que foi possível localizar na própria matriz do curso; o texto original do pré-requisito aparece sempre no painel de detalhes.'
   :'Fonte: abas de Transição da planilha Matrizes_por_periodo_nucleo_basico_comum.xlsx. '+D.courses.map(c=>`${esc(c.nome)}: ${esc(c.fonte.replace(/^Matriz ativa: /,''))}`).join(' · ')+' Pré-requisitos transcritos de: '+D.courses.map(c=>`${esc(c.nome)}: ${esc(c.fontePre)}`).join(' · ')+'. A divisão da CH em teórica, prática e EaD do PPC atual vem das matrizes desses mesmos PPCs (o PPC atual não tem CH de extensão). Optativas e atividades complementares não estão listadas.';
}

let pending=null;
function route(){
  const h=(location.hash||'#global').slice(1);
  document.querySelectorAll('#tabs a').forEach(a=>{if(a.dataset.h===h)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  const ci=SLUG.indexOf(h);
  if(ci>=0) renderCourse(ci); else if(h==='nucleo') renderNucleo(); else if(h==='equivalencias') renderEq(); else renderGlobal();
}
window.addEventListener('hashchange',route);

function legend(){
  return mode==='novo'
   ?'<span><i class="sw core"></i>Núcleo básico comum</span><span><i class="sw ext"></i>Extensão (ACE)</span><span><i class="sw opt"></i>Optativa</span><span><i class="sw"></i>Específica do curso</span>'
   :'<span><i class="sw core"></i>Mesmo código em 2 ou mais cursos</span><span><i class="sw"></i>Específica do curso</span>';
}

/* ---------- Busca global ---------- */
let gq='';
const nrmG=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
function gsearch(){
  const out=document.getElementById('gres');if(!out)return;
  const v=nrmG(gq);
  document.querySelectorAll('#gwrap .chip').forEach(ch=>ch.classList.remove('hit'));
  if(v.length<2){out.innerHTML='';return}
  const groups=new Map();
  [['atual',ATUAL],['novo',NOVO]].forEach(([m,D])=>D.courses.forEach((c,ci)=>c.items.forEach((it,ii)=>{
    if(!(nrmG(it.nome).includes(v)||nrmG(it.cod).includes(v)))return;
    const k=nrmG(it.nome).replace(/(\d) ?a$/,'$1a');
    if(!groups.has(k))groups.set(k,{nome:it.nome,minp:99,cells:[[],[],[],[],[]]});
    const g=groups.get(k);g.minp=Math.min(g.minp,it.per);g.cells[ci].push({m,per:it.per,ch:it.ch,cod:it.cod,ii});
  })));
  const rows=[...groups.values()].sort((a,b)=>a.minp-b.minp||a.nome.localeCompare(b.nome,'pt'));
  document.querySelectorAll('#gwrap .chip').forEach(ch=>{const it=DS().courses[ch.dataset.c].items[ch.dataset.i];if(nrmG(it.nome).includes(v)||nrmG(it.cod).includes(v))ch.classList.add('hit')});
  if(!rows.length){out.innerHTML=`<p class="ghint">Nenhuma disciplina encontrada para “${esc(gq)}” nos dois PPCs.</p>`;return}
  const nA=rows.reduce((s,r)=>s+r.cells.flat().filter(x=>x.m==='atual').length,0),nN=rows.reduce((s,r)=>s+r.cells.flat().filter(x=>x.m==='novo').length,0);
  let h=`<p class="ghint">${rows.length} disciplina${rows.length>1?'s':''} encontrada${rows.length>1?'s':''}: ${nA} ocorrência${nA!==1?'s':''} no PPC atual e ${nN} no PPC novo. Clique numa ocorrência para abrir o fluxograma do curso.</p>
  <div class="gscroll"><table class="gres"><thead><tr><th>Disciplina</th>${SHORT.map((s,i)=>`<th style="--cc:var(--c${i})"><span class="dot"></span>${s}</th>`).join('')}</tr></thead><tbody>`;
  rows.forEach(r=>{h+=`<tr><td><b>${esc(r.nome)}</b></td>`+r.cells.map((cs,ci)=>`<td>${cs.length?cs.sort((a,b)=>(a.m>b.m?1:-1)).map(x=>`<button type="button" class="occ ${x.m}" data-go="${x.m}:${ci}:${x.ii}"><span class="ppc">${x.m==='atual'?'Atual':'Novo'}</span>${x.per}º · ${x.ch} h</button>`).join(''):'<span class="none">—</span>'}</td>`).join('')+'</tr>'});
  out.innerHTML=h+'</tbody></table></div>';
}

      hint.textContent=`${mode==='novo'?ref:ref+' '+it0.nome}: ${pers.join(' · ')}`;
    } else {ch.classList.add('on');hint.textContent=`${it0.nome} (${SHORT[ch.dataset.c]}, ${it0.per}º período, ${it0.ch} h): disciplina específica do curso.`}
  };

/* ---------- Fluxograma por curso ---------- */
function chParts(it){return mode==='novo'?[['Teór.',it.tp||0],['Prát.',it.pp||0],['EaD',(it.td||0)+(it.pd||0)],['Ext.',it.ext||0]]:[['Teór.',it.t||0],['Prát.',it.p||0],['EaD',it.e||0],['Ext.',0]]}
function chMini(it){return '<span class="chm">'+chParts(it).map(([l,v])=>`<span class="${v?'':'z'}"><i>${l}</i>${v}</span>`).join('')+'</span>'}
let ro=null;
const EMPTY={novo:'Clique numa disciplina para ver a carga horária detalhada, o pré-requisito como está no PPC, a equivalência com o perfil anterior e o que ela libera. A cadeia de pré-requisitos aparece destacada no mapa.',
  atual:'Clique numa disciplina para ver o código, a carga horária, os pré-requisitos, o que ela libera, em que outros cursos ela aparece e o que acontece com ela na transição para o PPC novo. A cadeia de pré-requisitos aparece destacada no mapa.'};
function renderCourse(ci){
  const D=DS(),c=D.courses[ci],items=c.items,novo=mode==='novo';
  items.forEach(it=>{it.deps=it.deps||[]});
  const kids=items.map(()=>[]);items.forEach((it,i)=>it.deps.forEach(d=>kids[d].push(i)));
  const listed=sum(items.map(i=>i.ch)),core=items.filter(i=>i.nbc);
  let h;
  if(novo){
    h=`<div class="meta"><span>CH das disciplinas: <b>${listed} h</b></span><span>Atividades autônomas: <b>${c.auto} h</b></span><span>Total do PPC: <b>${c.total} h</b></span><span>Núcleo comum: <b>${core.length} disciplinas, ${sum(core.map(i=>i.ch))} h</b></span><span>Pré-requisitos ligados: <b>${sum(items.map(i=>i.deps.length))}</b></span></div>
    <div class="legend">${legend().replace('<span><i class="sw"></i>Específica do curso</span>','')}<span><i class="sw edge"></i>Seta: pré-requisito → disciplina liberada</span><span><i class="sw" style="border-color:var(--c0);border-width:2px"></i>Exige (antes)</span><span><i class="sw" style="border-color:var(--hl);border-width:2px"></i>Libera (depois)</span></div>
    <div class="toolbar"><input type="search" id="q" placeholder="Buscar disciplina" aria-label="Buscar disciplina"><label><input type="checkbox" id="alle" checked> Mostrar todas as setas</label><button id="clr" type="button">Limpar seleção</button></div>`;
  } else {
    const cnt={};items.forEach(i=>{const k=sit(i)[1];cnt[k]=(cnt[k]||0)+1});
    h=`<div class="meta"><span>CH obrigatória: <b>${listed} h</b></span><span>Componentes obrigatórios: <b>${items.length}</b></span><span>Compartilhadas com outros cursos: <b>${core.length} disciplinas, ${sum(core.map(i=>i.ch))} h</b></span><span>Pré-requisitos ligados: <b>${sum(items.map(i=>i.deps.length))}</b></span></div>
    <div class="legend">${legend()}<span class="st ok">● aproveitada${cnt['aproveitada']?' ('+cnt['aproveitada']+')':''}</span><span class="st cond">● com condição${cnt['com condição']?' ('+cnt['com condição']+')':''}</span><span class="st opt">● vira optativa${cnt['vira optativa']?' ('+cnt['vira optativa']+')':''}</span><span class="st bad">● sem equivalência${cnt['sem equivalência']?' ('+cnt['sem equivalência']+')':''}</span>${cnt['omissão?']?`<span class="st cond">● provável omissão no quadro (${cnt['omissão?']})</span>`:''}</div>
    <div class="legend"><span><i class="sw edge"></i>Seta: pré-requisito → disciplina liberada</span><span><i class="sw" style="border-color:var(--c0);border-width:2px"></i>Exige (antes)</span><span><i class="sw" style="border-color:var(--hl);border-width:2px"></i>Libera (depois)</span></div>
    <div class="toolbar"><input type="search" id="q" placeholder="Buscar disciplina" aria-label="Buscar disciplina"><label><input type="checkbox" id="alle" checked> Mostrar todas as setas</label><button id="clr" type="button">Limpar seleção</button></div>`;
  }
  h+=`<div class="scroller"><div class="flow" id="flow"><svg class="edges" id="edges"></svg>`;
  for(let p=1;p<=10;p++){
    const its=items.map((it,i)=>[it,i]).filter(([it])=>it.per===p);
    h+=`<div class="col"><div class="colhead">${p}º <small>${sum(its.map(x=>x[0].ch))} h</small></div>`+
      its.map(([it,i])=>{const tag=novo?(it.nbc?'<span class="tag">comum</span>':''):`<span class="st ${sit(it)[0]}">${esc(sit(it)[1])}</span>`;
        return `<button class="card ${kind(it)}" id="k${i}" data-i="${i}" type="button"><span class="nm">${esc(it.nome)}</span><span class="ft"><span class="chT">${it.ch}<small> h</small></span>${tag}</span>${chMini(it)}</button>`}).join('')+'</div>';
  }
  h+=`</div></div><div class="detail empty" id="det">${EMPTY[mode]}</div>`;
  view.innerHTML=h;
  const flow=document.getElementById('flow'),svg=document.getElementById('edges');
  const draw=()=>{
    if(!flow.isConnected)return;
    const fr=flow.getBoundingClientRect();svg.setAttribute('width',flow.scrollWidth);svg.setAttribute('height',flow.scrollHeight);
    let s='';
    items.forEach((it,i)=>it.deps.forEach(d=>{
      const a=document.getElementById('k'+d).getBoundingClientRect(),b=document.getElementById('k'+i).getBoundingClientRect();
      const x1=a.right-fr.left,y1=a.top+a.height/2-fr.top,x2=b.left-fr.left,y2=b.top+b.height/2-fr.top,dx=Math.max(14,(x2-x1)*.45);
      s+=`<path class="e" data-f="${d}" data-t="${i}" d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2-1},${y2}"/>`;
    }));
    const mk=(id,c)=>`<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path class="${c}" d="M0,0 L10,5 L0,10 z"/></marker>`;
    svg.innerHTML='<defs>'+mk('ah','ah')+mk('ahu','ahu')+mk('ahd','ahd')+'</defs>'+s;applySel();
  };
  let sel=null;
  const walk=(start,g)=>{const out=new Set,st=[start];while(st.length){const x=st.pop();g[x].forEach(y=>{if(!out.has(y)){out.add(y);st.push(y)}})}return out};
  function applySel(){
    flow.querySelectorAll('.card').forEach(k=>k.classList.remove('on','sel','anc','desc'));
    svg.querySelectorAll('path').forEach(p=>p.classList.remove('on','up','down'));
    if(sel==null){flow.classList.remove('focus');return}
    const k=document.getElementById('k'+sel);k.classList.add('on','sel');
    const anc=walk(sel,items.map(x=>x.deps)),des=walk(sel,kids);
    flow.classList.add('focus');
    anc.forEach(i=>document.getElementById('k'+i).classList.add('on','anc'));
    des.forEach(i=>document.getElementById('k'+i).classList.add('on','desc'));
    svg.querySelectorAll('path').forEach(p=>{const f=+p.dataset.f,t=+p.dataset.t;
      if((t===sel||anc.has(t))&&(anc.has(f)))p.classList.add('on','up');
      else if((f===sel||des.has(f))&&des.has(t))p.classList.add('on','down');});
  }
  function detail(i){
    const det=document.getElementById('det');
    if(i==null){det.className='detail empty';det.textContent=EMPTY[mode];return}
    const it=items[i];det.className='detail';
    if(!novo){
      const s=sit(it);
      const lk=j=>`<button class="linkish" data-go="${j}">${esc(items[j].nome)}</button> <span class="chb">(${items[j].per}º)</span>`;
      det.innerHTML=`<div class="eyebrow">${esc(c.nome)} · PPC atual · ${it.per}º período · ${esc(it.cod)}</div><h2>${esc(it.nome)} ${it.nbc?`<span class="pill">Mesmo código em outros cursos</span>`:''}</h2>
      <dl><dt>Carga horária</dt><dd><b class="chb">${it.ch} h</b> <span class="chb" style="color:var(--muted)">(Teórica ${it.t||0} h · Prática ${it.p||0} h · EaD ${it.e||0} h)</span></dd>
      <dt>Pré-requisito no PPC</dt><dd>${it.deps.length?`<ul>${it.deps.map(j=>`<li>${lk(j)}</li>`).join('')}</ul>`:'Nenhum'}</dd>
      ${it.co?`<dt>Co-requisito</dt><dd>${esc(it.co)}</dd>`:''}
      <dt>Libera</dt><dd>${kids[i].length?`<ul>${kids[i].map(j=>`<li>${lk(j)}</li>`).join('')}</ul>`:'Nenhuma disciplina obrigatória tem esta como pré-requisito.'}</dd>
      <dt>Também em</dt><dd>${esc(it.tamb||'Só neste curso')}</dd></dl>
      <dl><dt>Na transição</dt><dd><span class="st ${s[0]}">● ${esc(it.sit)}</span></dd>
      <dt>No PPC novo</dt><dd>${esc(it.dest||'—')}</dd>
      ${it.cond?`<dt>Condição</dt><dd>${esc(it.cond)}</dd>`:''}</dl>`;
      return;
    }
    const chs=[['Teórica presencial',it.tp],['Teórica a distância',it.td],['Prática presencial',it.pp],['Prática a distância',it.pd],['Extensão',it.ext]].filter(x=>x[1]).map(x=>`${x[0]} ${x[1]} h`).join(' · ');
    const lk=j=>`<button class="linkish" data-go="${j}">${esc(items[j].nome)}</button> <span class="chb">(${items[j].per}º)</span>`;
    det.innerHTML=`<div class="eyebrow">${esc(c.nome)} · PPC novo · ${it.per}º período${it.cod?' · '+esc(it.cod):''}</div><h2>${esc(it.nome)} ${it.nbc?`<span class="pill">Núcleo comum: ${esc(it.nbc)}</span>`:''}</h2>
      <dl><dt>Carga horária</dt><dd><b class="chb">${it.ch} h</b>${chs?` <span class="chb" style="color:var(--muted)">(${chs})</span>`:''}</dd>
      <dt>Pré-requisito no PPC</dt><dd>${esc(it.pre&&it.pre!=='-'?it.pre:'Nenhum')}</dd>
      ${it.deps.length?`<dt>Ligado no mapa a</dt><dd><ul>${it.deps.map(j=>`<li>${lk(j)}</li>`).join('')}</ul></dd>`:''}
      ${it.unres.length?`<dt>Não localizado</dt><dd><span class="pill warn">${esc(it.unres.join(', '))}</span> não aparece com esse nome na matriz deste curso.</dd>`:''}
      <dt>Libera</dt><dd>${kids[i].length?`<ul>${kids[i].map(j=>`<li>${lk(j)}</li>`).join('')}</ul>`:'Nenhuma disciplina tem esta como pré-requisito.'}</dd></dl>
      <dl><dt>Equivalência</dt><dd>${esc(it.eq||'—')}${it.obs?`<br><span style="color:var(--muted)">${esc(it.obs)}</span>`:''}</dd>
      ${it.tamb?`<dt>Também em</dt><dd>${esc(it.tamb)}</dd>`:''}</dl>`;
  }
  const select=i=>{sel=(i===sel?null:i);applySel();detail(sel);};
  flow.addEventListener('click',e=>{const k=e.target.closest('.card');if(k)select(+k.dataset.i)});
  document.getElementById('det').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){sel=null;select(+b.dataset.go);document.getElementById('k'+b.dataset.go).scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'})}});
  const q=document.getElementById('q');
  document.getElementById('clr').onclick=()=>{sel=null;applySel();detail(null);q.value='';search()};
  const alle=document.getElementById('alle');if(alle)alle.onchange=e=>flow.classList.toggle('noedges',!e.target.checked);
  const nrm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  const search=()=>{const v=nrm(q.value.trim());flow.querySelectorAll('.card').forEach(k=>k.classList.toggle('match',!!v&&nrm(items[k.dataset.i].nome).includes(v)))};
  q.addEventListener('input',search);
  q.addEventListener('keydown',e=>{if(e.key==='Enter'){const m=flow.querySelector('.card.match');if(m){sel=null;select(+m.dataset.i);m.scrollIntoView({block:'nearest',inline:'center'})}}});
  if(ro)ro.disconnect();ro=new ResizeObserver(()=>draw());ro.observe(flow);
  (document.fonts?document.fonts.ready:Promise.resolve()).then(draw);
  draw();
  if(pending!=null){const p=pending;pending=null;select(p);requestAnimationFrame(()=>document.getElementById('k'+p).scrollIntoView({block:'nearest',inline:'center'}))}
}

/* ---------- Núcleo comum ---------- */

  ${eqBar()}
  <div class="eqbar" role="group" aria-label="Filtro">${chips.map(([k,l])=>`<button type="button" class="nbf" data-f="${k}" aria-pressed="${k===nbFilter}">${l} <b>${cnt[k]}</b></button>`).join('')}<input type="search" id="eqq" placeholder="Buscar disciplina" aria-label="Buscar disciplina"></div>
  <div class="gscroll"><table class="nbq" id="eqt"><thead><tr><th>Disciplina</th><th>Curso</th><th>Código</th><th>Nome no PPC novo</th><th>Per. · CH</th><th title="Teórica / EaD / Prática / Extensão">T / EaD / P / Ext</th><th>Pré-requisito</th><th>Equivale a (PPC atual)</th><th>Observações: discrepâncias entre os PPCs</th></tr></thead>`;
  const top=a=>{const m={};a.forEach(x=>m[x]=(m[x]||0)+1);let b=null,bc=0;for(const k in m)if(m[k]>bc){b=k;bc=m[k]}return b};
  const TIPO={nucleo:'núcleo comum',compart:'compartilhada',semelhante:'nome semelhante'};
  NBEQ.forEach(g=>{
    if(nbFilter==='nucleo'&&g.tipo!=='nucleo')return; if(nbFilter==='compart'&&g.tipo==='nucleo')return; if(nbFilter==='dif'&&!g.obs.length)return;
    const R=g.rows,n=R.length;
    const val={nome:r=>r.nome,per:r=>r.per+'|'+r.ch,sp:r=>r.sp.join('/'),cod:r=>r.cod,pre:r=>r.pk,eq:r=>r.eq.map(e=>e.a[0]+e.t+e.s).sort().join('+')||r.q};
    const tp={};for(const k in val)tp[k]=top(R.map(val[k]));
    const dk=(k,r)=>{const kk=k==='per'?['per','ch']:[k];if(!kk.some(x=>g.ok.includes(x)))return'';return n>2?(val[k](r)!==tp[k]?' dif':''):' dif'};
    const s=esc((g.ref+' '+R.map(r=>r.nome+' '+r.cod).join(' ')).toLowerCase());
    h+=`<tbody class="g" data-s="${s}">`;
    R.forEach((r,j)=>{
      const eq=r.eq.length?r.eq.map(e=>{const T=EQT[e.t];return `<div class="eqi">${esc(e.a[0])} ${esc(e.a[1])} <span class="mut">(${e.a[3]} h)</span> <span class="tagq ${T[0]}">${T[1]}</span> <span class="nbtip">${EQS[e.s]||''}</span>${e.o?`<small>${esc(e.o)}</small>`:''}</div>`}).join(''):(r.q?`<span class="mut">Associada à optativa ${esc(r.q)}</span>`:'<span class="tagq bad">Sem equivalência</span>');
      h+=`<tr>${j===0?`<td class="ref" rowspan="${n}">${esc(g.ref)}<small>${TIPO[g.tipo]} · ${n} cursos</small></td>`:''}
      <td class="cur" style="--cc:var(--c${r.c})"><span class="dot"></span><a href="#${SLUG[r.c]}" style="color:inherit">${SHORT[r.c]}</a></td>
      <td class="num${dk('cod',r)}">${r.cod?esc(r.cod):'<span class="mut">a definir</span>'}</td>
      <td class="${dk('nome',r).trim()}">${esc(r.nome)}</td>
      <td class="num${dk('per',r)}">${r.per}º · ${r.ch} h</td>
      <td class="num${dk('sp',r)}">${r.sp.join(' / ')}</td>
      <td class="${dk('pre',r).trim()}">${r.pre?esc(r.pre):'<span class="mut">—</span>'}</td>
      <td class="${dk('eq',r).trim()}">${eq}</td>
      ${j===0?`<td class="obsc" rowspan="${n}">${g.obs.length?'<ul>'+g.obs.map(o=>`<li>${esc(o)}</li>`).join('')+'</ul>':'<span class="okk">Sem discrepâncias entre os PPCs.</span>'}</td>`:''}</tr>`;
    });
    h+='</tbody>';
  });
  h+=`</table></div><p class="ghint" style="margin-top:10px">Núcleo comum: disciplinas marcadas como núcleo básico comum na planilha Matrizes_por_periodo_nucleo_basico_comum.xlsx. Compartilhadas: disciplinas com o mesmo nome em mais de um curso (coluna "Também ofertada em" ou nome igual a menos da numeração). "Nome semelhante": pares que podem ser a mesma disciplina e precisam de conferência. Equivalências tiradas da aba de cada curso nesta página.</p></section>`;
  view.innerHTML=h;
  view.querySelectorAll('.eqc').forEach(b=>b.onclick=()=>{eqCourse=+b.dataset.c;renderEq()});
  view.querySelectorAll('.nbf').forEach(b=>b.onclick=()=>{nbFilter=b.dataset.f;renderEq()});
  const q=document.getElementById('eqq'),nrm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  q.oninput=()=>{const v=nrm(q.value.trim());view.querySelectorAll('#eqt tbody.g').forEach(tb=>tb.hidden=!!v&&!nrm(tb.dataset.s).includes(v))};
}
function renderEq(){
  if(eqCourse===5)return renderNbEq();
  const E=EQ[eqCourse],cnt={all:E.rows.length};E.rows.forEach(r=>cnt[r.t]=(cnt[r.t]||0)+1);
  const chips=[['all','Todas'],['direta','Equivalência direta'],['cond','Com condição'],['opt','Vira optativa'],['sem','Sem equivalência'],['novo','Só no PPC novo']];
  cnt.novo=E.extra.length;
  let h=`<section class="eqh"><h2>Equivalências para aproveitamento</h2>
  <p class="ghint">A coluna "Presente nos PPCs" indica os cursos cujo PPC traz a mesma equivalência (mesma disciplina do PPC atual, mesmo destino no PPC novo e mesmo tipo de aproveitamento): CI Civil, EL Elétrica, EO Eletrônica, ME Mecânica, MA Materiais.</p>
  <p class="ghint">Cada linha liga uma disciplina obrigatória do PPC atual à disciplina do PPC novo em que ela pode ser aproveitada, com o tipo de equivalência e o sentido em que vale. "Atual ↔ novo" vale nos dois sentidos; "Só atual → novo" serve a quem migra, mas quem cursou a disciplina nova não aproveita no perfil atual.</p>
  ${eqBar()}
  <div class="eqbar" role="group" aria-label="Filtro">${chips.map(([k,l])=>`<button type="button" class="eqf ${k}" data-f="${k}" aria-pressed="${k===eqFilter}">${l} <b>${cnt[k]||0}</b></button>`).join('')}<input type="search" id="eqq" placeholder="Buscar disciplina" aria-label="Buscar disciplina"></div>
  <div class="gscroll"><table class="eq" id="eqt"><thead><tr><th colspan="3" class="grp">PPC atual (matriz ativa)</th><th colspan="2" class="grp">PPC novo</th><th rowspan="2">Aproveitamento</th><th rowspan="2">Sentido</th><th rowspan="2" title="Cursos cujo PPC traz esta mesma equivalência">Presente nos PPCs</th><th rowspan="2">Condição / observação</th></tr>
  <tr><th>Código</th><th>Disciplina</th><th>Per. · CH</th><th>Disciplina</th><th>Per. · CH</th></tr></thead><tbody>`;
  const show=k=>eqFilter==='all'||eqFilter===k;
  E.rows.forEach(r=>{ if(!show(r.t))return; const T=EQT[r.t];
    const nv=r.n.length?r.n.map(n=>esc(n[0])).join('<br>'):`<span class="mut">${esc(r.dest||'—')}</span>`;
    const nc=r.n.length?r.n.map(n=>`${n[1]}º · ${n[2]} h`).join('<br>'):'';
    h+=`<tr data-s="${esc((r.a[1]+' '+r.n.map(n=>n[0]).join(' ')+' '+r.a[0]).toLowerCase())}"><td class="chb">${esc(r.a[0])}</td><td>${esc(r.a[1])}</td><td class="chb">${r.a[2]}º · ${r.a[3]} h</td><td>${nv}</td><td class="chb">${nc}</td><td><span class="tagq ${T[0]}">${T[1]}</span></td><td class="nowrap">${EQS[r.s]}</td><td>${ppTags(r.pp)}</td><td class="mut">${esc(r.o)}</td></tr>`;});
  if(eqFilter==='all'||eqFilter==='novo'){
    h+=`<tr class="sep"><td colspan="9">Disciplinas do PPC novo sem correspondente obrigatória na matriz ativa: quem migra precisa cursá-las${E.extra.some(x=>x.q)?' (salvo as que o quadro associa a uma optativa do perfil atual)':''}</td></tr>`;
    E.extra.forEach(x=>{h+=`<tr data-s="${esc(x.n[0].toLowerCase())}"><td class="mut">—</td><td class="mut">${x.q?esc(x.q)+' <small>(optativa no perfil atual)</small>':'—'}</td><td></td><td>${esc(x.n[0])}</td><td class="chb">${x.n[1]}º · ${x.n[2]} h</td><td><span class="tagq ${x.q?'cond':'new'}">${x.q?'Pela optativa':'Cursar no novo'}</span></td><td class="nowrap">${x.q?'Atual ↔ novo':'—'}</td><td>${ppTags(x.pp)}</td><td class="mut">${esc(x.o)}</td></tr>`});
  }
  h+='</tbody></table></div><p class="ghint" style="margin-top:10px">Fonte: abas de Transição da planilha Matrizes_por_periodo_nucleo_basico_comum.xlsx, montadas a partir dos quadros de equivalência dos PPCs novos e das grades ativas do SIGAA.</p></section>';
  view.innerHTML=h;
  view.querySelectorAll('.eqc').forEach(b=>b.onclick=()=>{eqCourse=+b.dataset.c;renderEq()});
  view.querySelectorAll('.eqf').forEach(b=>b.onclick=()=>{eqFilter=b.dataset.f;renderEq()});
  const q=document.getElementById('eqq'),nrm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  q.oninput=()=>{const v=nrm(q.value.trim());view.querySelectorAll('#eqt tbody tr[data-s]').forEach(tr=>tr.hidden=!!v&&!nrm(tr.dataset.s).includes(v))};
}
setMode(mode);
})();
</script>
